<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lịch Sử 1954–1975</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #2c3e50; color: #333; }
        #map { flex: 1; height: 100%; }
        
        #sidebar {
            width: 300px;
            background: linear-gradient(135deg, #8B0000 0%, #B22222 100%);
            color: #FFD700;
            padding: 14px;
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .header { text-align: center; margin-bottom: 12px; border-bottom: 2px solid #FFD700; padding-bottom: 8px; }
        .header h1 { font-size: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .team-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; flex: 0 0 auto; margin-bottom: 12px; }
        .team { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 9px; 
            border-radius: 7px; 
            border: 2px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .team.active { border-color: #FFD700; background: rgba(255, 215, 0, 0.2); transform: scale(1.02); }
        .team-name { font-weight: bold; font-size: 15px; }
        .team-score { font-size: 17px; font-weight: bold; background: #FFD700; color: #8B0000; padding: 4px 7px; border-radius: 5px; }

        .historical-banner {
            margin: 2px 0 10px;
            text-align: center;
        }
        .historical-banner img {
            display: block;
            width: 100%;
            height: 128px;
            object-fit: cover;
            object-position: center 48%;
            border-radius: 8px;
            border: 1px solid rgba(255,215,0,0.65);
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        }
        .historical-caption {
            margin-top: 5px;
            color: #FFD700;
            font-size: 12px;
            font-style: italic;
            line-height: 1.25;
        }
        
        .end-game-btn {
            background: #FFD700; color: #8B0000; font-weight: bold; font-size: 14px;
            padding: 11px; border: none; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; transition: 0.3s;
        }
        .end-game-btn:hover { background: #fff; transform: scale(1.05); }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; width: 90%; max-width: 600px; padding: 30px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; position: relative;
        }
        .timer { font-size: 30px; font-weight: bold; color: #e74c3c; margin-bottom: 15px; }
        .event-meta { font-size: 14px; color: #7f8c8d; font-weight: 600; margin-bottom: 8px; }
        .question-text { font-size: 22px; font-weight: bold; margin-bottom: 25px; color: #2c3e50; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn {
            padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer;
            border: 2px solid #3498db; background: #fff; color: #3498db; border-radius: 8px;
            transition: all 0.2s;
        }
        .option-btn:hover { background: #3498db; color: #fff; }
        .option-btn.correct { background: #2ecc71; border-color: #2ecc71; color: #fff; }
        .option-btn.wrong { background: #e74c3c; border-color: #e74c3c; color: #fff; }
        
        .custom-marker {
            width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: white; background-color: #7f8c8d; cursor: pointer;
            transition: all 0.3s;
        }
        .marker-label { font-weight: bold; color: #8B0000; text-shadow: 1px 1px 2px white; font-size: 14px; white-space: nowrap; }
        
        #end-screen { text-align: center; }
        #end-screen h2 { color: #e74c3c; font-size: 32px; margin-bottom: 20px; }
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 15px; margin-top: 30px; height: 200px; }
        .podium-bar { 
            width: 70px; display: flex; flex-direction: column; justify-content: flex-start; 
            padding-top: 10px; font-weight: bold; border-radius: 10px 10px 0 0; 
            transition: height 0.5s ease-in-out; text-align: center;
        }
    </style>
</head>
<body>

    <div id="map"></div>

            <h1>Kháng Chiến Chống Mỹ</h1>
                    </div>

        </div>

            { id: 3, lat: 11.6179, lng: 108.8763, name: "Bắc Ái – Ninh Thuận", event: "Những cuộc nổi dậy mở đầu phong trào Đồng khởi", year: "1954–1960", q: "Bắc Ái (Ninh Thuận) cùng với địa điểm nào sau đây được SGK nêu là nơi diễn ra các cuộc nổi dậy mở đầu phong trào Đồng khởi?", options: ["Vĩnh Thạnh", "Ấp Bắc", "Bình Giã", "Vạn Tường"], answer: 0, status: null },

            { id: 5, lat: 10.2415, lng: 106.3752, name: "Bến Tre", event: "Đồng khởi tiêu biểu", year: "1959–1960", q: "Thắng lợi Đồng khởi ở Bến Tre có ý nghĩa nổi bật nào đối với cách mạng miền Nam?", options: ["Chuyển từ thế giữ gìn lực lượng sang thế tiến công", "Mở đầu chiến tranh phá hoại miền Bắc", "Kết thúc chiến tranh cục bộ", "Mở đầu Chiến dịch Hồ Chí Minh"], answer: 0, status: null },

            { id: 8, lat: 11.5350, lng: 106.8789, name: "Đồng Xoài – Bình Phước", event: "Chiến thắng Đồng Xoài", year: "1964–1965", q: "Theo SGK, chiến thắng Đồng Xoài cùng với Bình Giã, An Lão và Ba Gia góp phần làm thất bại chiến lược nào?", options: ["Chiến tranh cục bộ", "Việt Nam hoá chiến tranh", "Chiến tranh đặc biệt", "Chiến tranh phá hoại lần thứ nhất"], answer: 2, status: null },

            { id: 10, lat: 16.4637, lng: 107.5905, name: "Huế", event: "Tổng tiến công và nổi dậy Xuân Mậu Thân", year: "1965–1968", q: "Huế là một địa bàn tiêu biểu gắn với sự kiện nào trong giai đoạn 1965–1968?", options: ["Tổng tiến công và nổi dậy Xuân Mậu Thân", "Phong trào Đồng khởi", "Chiến thắng Bình Giã", "Chiến dịch Tây Nguyên"], answer: 0, status: null },
            { id: 11, lat: 16.7500, lng: 107.1833, name: "Quảng Trị", event: "Tiến công chiến lược năm 1972", year: "1969–1973", q: "Cuộc Tiến công chiến lược năm 1972 bắt đầu từ hướng Quảng Trị và có tác động nào sau đây?", options: ["Mở đầu Chiến tranh đặc biệt", "Kết thúc phong trào Đồng khởi", "Mở đầu chiến tranh phá hoại lần thứ nhất", "Buộc Mỹ phải thừa nhận thất bại của chiến lược Việt Nam hoá chiến tranh"], answer: 3, status: null },
            { id: 12, lat: 20.8449, lng: 106.6881, name: "Hải Phòng", event: "Điện Biên Phủ trên không", year: "1969–1973", q: "Trong cuộc tập kích chiến lược bằng B-52, Hải Phòng cùng với địa điểm nào là mục tiêu quan trọng được SGK nhắc tới?", options: ["Bến Tre", "Huế", "Hà Nội", "Đồng Xoài"], answer: 2, status: null },
            { id: 13, lat: 21.0285, lng: 105.8542, name: "Hà Nội", event: "Điện Biên Phủ trên không", year: "1969–1973", q: "Thắng lợi 'Điện Biên Phủ trên không' có ý nghĩa trực tiếp nào đối với quan hệ Việt Nam – Mỹ?", options: ["Mở đầu Chiến tranh đặc biệt", "Góp phần buộc Mỹ chấm dứt chiến tranh phá hoại miền Bắc và đi tới Hiệp định Pa-ri", "Đưa cách mạng miền Nam sang thế giữ gìn lực lượng", "Mở đầu Tổng tiến công Xuân 1975"], answer: 1, status: null },

            { id: 16, lat: 10.9330, lng: 107.2430, name: "Xuân Lộc", event: "Phá vỡ tuyến phòng thủ Xuân Lộc", year: "1973–1975", q: "Theo SGK, việc tiêu diệt căn cứ phòng thủ Xuân Lộc có vai trò gì trong tiến trình giải phóng Sài Gòn?", options: ["Mở đường cho các cánh quân tiến vào trung tâm Sài Gòn", "Mở đầu phong trào Đồng khởi", "Làm phá sản Chiến tranh đặc biệt", "Mở đầu chiến tranh phá hoại miền Bắc"], answer: 0, status: null },

            { id: 18, lat: 10.7769, lng: 106.6951, name: "Dinh Độc Lập – Sài Gòn", event: "Chiến dịch Hồ Chí Minh", year: "1973–1975", q: "Chiến dịch Hồ Chí Minh toàn thắng được báo hiệu bởi sự kiện nào tại Dinh Độc Lập?", options: ["Việc mở đầu chiến tranh cục bộ", "Lá cờ cách mạng tung bay trên nóc Dinh Độc Lập", "Việc thành lập Mặt trận Dân tộc Giải phóng miền Nam", "Việc mở chiến dịch Vạn Tường"], answer: 1, status: null },
            { id: 19, lat: 10.7760, lng: 106.6950, name: "Sài Gòn – Gia Định", event: "Chiến dịch giải phóng Sài Gòn – Gia Định", year: "1973–1975", q: "Chiến dịch giải phóng Sài Gòn – Gia Định còn được gọi là gì?", options: ["Chiến dịch Tây Nguyên", "Chiến dịch Huế – Đà Nẵng", "Chiến dịch Hồ Chí Minh", "Chiến dịch Đông – Xuân"], answer: 2, status: null },

        ];

        // --- STATE ---
        let currentTeamIndex = 0;
        let activeLocationId = null;
        let timerInterval = null;
        let questionCloseTimeout = null;
        let timeLeft = 30;

        // --- AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        function soundClick() { playTone(600, 'sine', 0.1); }
        function soundCorrect() { 
            playTone(440, 'sine', 0.1); 
            setTimeout(() => playTone(660, 'sine', 0.2), 100); 
            setTimeout(() => playTone(880, 'sine', 0.3), 200); 
        }
        function soundWrong() { playTone(200, 'sawtooth', 0.4); }
        function soundWin() {
            [440, 554, 659, 880].forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'square', 0.3), i * 200);
            });
        }

        // --- INIT MAP ---
        const map = L.map('map', {
            center: [16.0, 106.0],
            zoom: 6,
            minZoom: 5,
            maxBounds: [[8.0, 102.0], [24.0, 110.0]]
        });

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        L.marker([16.5, 112.0], { icon: L.divIcon({ className: 'marker-label', html: '🇻🇳 Quần đảo Hoàng Sa' }) }).addTo(map);
        L.marker([10.0, 114.0], { icon: L.divIcon({ className: 'marker-label', html: '🇻🇳 Quần đảo Trường Sa' }) }).addTo(map);

        locations.forEach((loc, index) => {
            const icon = L.divIcon({
                className: '',
                html: `<div class="custom-marker" id="marker-${loc.id}">${index + 1}</div>
                       <div class="marker-label">${loc.name}</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            const marker = L.marker([loc.lat, loc.lng], { icon: icon }).addTo(map);
            marker.on('click', () => handleMarkerClick(loc.id));
        });

        // --- UI UPDATES ---
        function updateSidebar() {
            const list = document.getElementById('team-list');
            list.innerHTML = '';
            teams.forEach((team, index) => {
                const div = document.createElement('div');
                div.className = `team ${index === currentTeamIndex ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="team-name" style="color: ${team.color}">${team.name}</div>
                    <div class="team-score">${team.score}</div>
                `;
                list.appendChild(div);
            });
        }

        // --- GAME LOGIC ---
        function handleMarkerClick(locId) {
            const loc = locations.find(l => l.id === locId);
            // Block if question was already answered (correct or wrong)
            if (loc.status !== null) return; 

            soundClick();
            activeLocationId = locId;
            map.flyTo([loc.lat, loc.lng], Math.max(map.getZoom(), 7), { duration: 0.5 });
            openQuestionModal(loc);
        }

        function openQuestionModal(loc) {
            // Hủy timeout đóng câu hỏi cũ trước khi mở câu mới.
            clearTimeout(questionCloseTimeout);
            questionCloseTimeout = null;

            document.getElementById('event-meta').innerText = `📍 ${loc.name} • ${loc.year} • ${loc.event}`;
            document.getElementById('question-text').innerText = loc.q;
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            loc.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => submitAnswer(index);
                grid.appendChild(btn);
            });

            document.getElementById('question-modal').style.display = 'flex';
            startTimer();
        }

        function startTimer() {
            timeLeft = 30;
            document.getElementById('timer').innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAnswer(); // Hết giờ -> chốt sai và đóng
                }
            }, 1000);
        }

        function submitAnswer(selectedIndex) {
            const loc = locations.find(l => l.id === activeLocationId);
            // Một câu chỉ được chấm MỘT lần. Sau khi đã sai thì mọi click tiếp theo bị bỏ qua.
            if (!loc || loc.status !== null) return;

            const btns = document.querySelectorAll('.option-btn');
            clearInterval(timerInterval);

            if (selectedIndex === loc.answer) {
                if (btns[loc.answer]) btns[loc.answer].classList.add('correct');
                soundCorrect();
                handleCorrectAnswer();
            } else {
                // Chọn sai = CHỐT SAI NGAY LẬP TỨC.
                // Không cho phép chọn lại đáp án đúng sau đó.
                loc.status = 'wrong';

                if (selectedIndex !== null && btns[selectedIndex]) {
                    btns[selectedIndex].classList.add('wrong');
                }
                if (btns[loc.answer]) btns[loc.answer].classList.add('correct');
                btns.forEach(btn => btn.disabled = true);

                soundWrong();
                handleWrongAnswer();
            }
        }

        function handleCorrectAnswer() {
            const loc = locations.find(l => l.id === activeLocationId);
            if (!loc || loc.status !== null) return; // Không cộng điểm lần 2

            const currentTeam = teams[currentTeamIndex];
            clearTimeout(questionCloseTimeout);
            questionCloseTimeout = null;
            clearInterval(timerInterval);

            currentTeam.score += 10;
            loc.status = 'correct';
            
            const markerDiv = document.getElementById(`marker-${loc.id}`);
            if(markerDiv) {
                markerDiv.style.backgroundColor = '#2ecc71'; // Green
                markerDiv.innerText = "✓";
            }

            questionCloseTimeout = setTimeout(() => {
                questionCloseTimeout = null;
                document.getElementById('question-modal').style.display = 'none';
                updateSidebar();
                checkEndGame();
            }, 1500);
        }

        function handleWrongAnswer() {
            const loc = locations.find(l => l.id === activeLocationId);
            if (!loc) return;

            // Chốt sai ngay khi trả lời sai hoặc khi hết giờ.
            // Nếu đã là 'wrong' thì giữ nguyên; không bao giờ chuyển ngược sang 'correct'.
            if (loc.status === null) {
                loc.status = 'wrong';
            }

            // loc.status đã được chốt thành 'wrong' ngay khi người chơi chọn sai.
            // Hàm này chỉ đảm nhiệm việc hiển thị trạng thái và đóng modal.
            const markerDiv = document.getElementById(`marker-${loc.id}`);
            if(markerDiv) {
                markerDiv.style.backgroundColor = '#e74c3c';
                markerDiv.innerText = "✗";
            }

            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

            clearTimeout(questionCloseTimeout);
            questionCloseTimeout = setTimeout(() => {
                questionCloseTimeout = null;
                document.getElementById('question-modal').style.display = 'none';
                checkEndGame();
            }, 1500);
        }

        function checkEndGame() {
            const unlocked = locations.filter(l => l.status === null).length;
            if (unlocked === 0) {
                setTimeout(showEndScreen, 500);
            } else {
                nextTurn();
            }
        }
        
        function nextTurn() {
            currentTeamIndex = (currentTeamIndex + 1) % teams.length;
            updateSidebar();
        }

        function showEndScreen() {
            soundWin();
            confetti({ particleCount: 150, spread: 180, origin: { y: 0.6 } });
            document.getElementById('end-modal').style.display = 'flex';
            
            // Sort teams by score descending
            const sortedTeams = [...teams].sort((a, b) => b.score - a.score);
            
            // Assign ranks (handle ties)
            let currentRank = 1;
            let prevScore = sortedTeams[0].score;
            sortedTeams.forEach(team => {
                if (team.score < prevScore) {
                    currentRank++;
                    prevScore = team.score;
                }
                team.rank = currentRank;
            });

            const rankStyles = {
                1: { height: '100%', bg: '#FFD700', color: '#8B0000' }, // Gold
                2: { height: '75%', bg: '#C0C0C0', color: '#333' },    // Silver
                3: { height: '50%', bg: '#cd7f32', color: '#fff' }     // Bronze
            };
            const defaultStyle = { height: '35%', bg: '#7f8c8d', color: '#fff' };

            const podium = document.getElementById('podium');
            podium.innerHTML = '';
            
            // Render side by side in order of Rank
            sortedTeams.forEach(team => {
                const style = rankStyles[team.rank] || defaultStyle;
                const bar = document.createElement('div');
                bar.className = 'podium-bar';
                bar.style.height = style.height;
                bar.style.backgroundColor = style.bg;
                bar.style.color = style.color;
                bar.innerHTML = `<div>${team.score}đ</div><div style="font-size:12px; margin-top:5px; padding: 0 5px;">${team.name}</div><div style="font-size:10px; opacity:0.8;">Hạng ${team.rank}</div>`;
                podium.appendChild(bar);
            });
        }

        function resetGame() {
            // Reset state
            teams.forEach(t => t.score = 0);
            currentTeamIndex = 0;
            activeLocationId = null;
            clearInterval(timerInterval);
            clearTimeout(questionCloseTimeout);
            questionCloseTimeout = null;

            // Reset locations & markers
            locations.forEach((loc, index) => {
                loc.status = null;
                const markerDiv = document.getElementById(`marker-${loc.id}`);
                if (markerDiv) {
                    markerDiv.style.backgroundColor = '#7f8c8d';
                    markerDiv.innerText = index + 1;
                }
            });

            // Hide Modals
            document.getElementById('end-modal').style.display = 'none';
            document.getElementById('question-modal').style.display = 'none';

            // Refresh UI
            updateSidebar();
        }

        // Initialize
        updateSidebar();
    </script>
</body>
</html>
